name: Metadata tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s tests -v
        env:
          TEST_EXIFTOOL: /usr/bin/exiftool
      - run: node tests/test_web.cjs examples/SYNTHETIC_sample.jpg
      - run: python -m compileall -q src
      - run: python build_web.py && git diff --exit-code -- web/index.html
